<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarkSet · 本地完善</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="mark">MarkSet</span>
          <span class="week">圈画批注后导出网页</span>
        </div>
        <div class="top-actions">
          <div class="import-box">
            <button type="button" id="btn-import-html" class="mode-btn">导入 HTML</button>
            <button type="button" id="btn-export-html" class="mode-btn">导出网页</button>
          </div>
          <button type="button" id="btn-lasso" class="mode-btn" aria-pressed="false">画笔</button>
          <label class="allow-models" title="默认关闭。只有勾上后，改写才会打通义千问，改图才会打万相。">
            <input type="checkbox" id="allow-models" />
            允许调用云端模型
          </label>
        </div>
      </header>

      <div class="workspace">
        <main class="stage">
          <article class="page" aria-label="混排实验页">
            <p class="kicker" id="page-kicker" hidden></p>
            <div id="editor"></div>
            <div id="web-doc-host" class="web-doc-host" hidden>
              <iframe id="web-doc-frame" class="web-doc-frame" title="导入的网页" sandbox="allow-same-origin"></iframe>
            </div>
          </article>
        </main>

        <aside class="inspector" aria-label="当前篮子">
          <h2>选中列表</h2>
          <p class="inspector-lead">用画笔涂过要改的字或图，再在旁边手写一两个字。系统按写下的字推测操作，由你点选。写错可擦掉重写。认不出时仍给通用项。价格、物流不改。</p>
          <ul id="selection-list" class="selection-list"></ul>
          <h2>未涂全</h2>
          <ul id="suggest-list" class="selection-list"></ul>
          <pre id="inspector-json">{}</pre>
        </aside>
      </div>
    </div>

    <svg id="lasso-layer" class="lasso-layer" aria-hidden="true"></svg>
    <svg id="paint-layer" class="paint-layer" aria-hidden="true"></svg>
    <svg id="ink-layer" class="ink-layer" aria-hidden="true"></svg>
    <div id="chrome-layer" class="chrome-layer"></div>
    <div id="toast" class="toast" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
