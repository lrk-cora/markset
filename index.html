<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarkSet · 第 2 周</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="mark">MarkSet</span>
          <span class="week">第 2 周 · 默认不打模型</span>
        </div>
        <div class="top-actions">
          <button type="button" id="btn-lasso" class="mode-btn" aria-pressed="false">套索</button>
          <button type="button" id="btn-subtract" class="mode-btn" aria-pressed="false">减选</button>
          <button type="button" id="btn-undo" class="mode-btn" hidden>撤销插入</button>
          <button type="button" id="btn-api" class="mode-btn">检查接口</button>
          <label class="allow-models" title="默认关闭。套索、改选区、检查接口从不消耗额度。改写/改图前还要再确认一次。">
            <input type="checkbox" id="allow-models" />
            允许调用云端模型
          </label>
          <label class="allow-models" title="默认关闭：选区就是鼠标圈出来的像素。打开后，每次圈图松手都会调用 SAM 贴到物体，消耗 fal 额度。减选仍用本地像素。">
            <input type="checkbox" id="snap-contour" />
            松手自动贴物体
          </label>
          <p class="hint">
            <kbd>Shift</kbd> 加上　<kbd>Alt</kbd> 减选　页上空白可插入　<kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销插入　<kbd>Esc</kbd> 清空
          </p>
        </div>
      </header>

      <div class="workspace">
        <main class="stage">
          <article class="page" aria-label="混排实验页">
            <p class="kicker">商品介绍 · 就地改一处</p>
            <div id="editor"></div>
          </article>
        </main>

        <aside class="inspector" aria-label="当前篮子">
          <h2>选中列表</h2>
          <p class="inspector-lead">松手后相同文案会出虚线，勾选才加入。品名贴到价格时拖蓝条。包装上的旧名：点「统一风格/替换」会先问，勾选后再圈那几个字（不贴物体）。一张图两件货用 Shift 再圈。只改字则取消勾选 #I。圈多了桌子用 Alt 减选，不要点 ×。</p>
          <ul id="selection-list" class="selection-list"></ul>
          <pre id="inspector-json">{}</pre>
        </aside>
      </div>
    </div>

    <svg id="lasso-layer" class="lasso-layer" aria-hidden="true"></svg>
    <div id="chrome-layer" class="chrome-layer"></div>
    <div id="toast" class="toast" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
